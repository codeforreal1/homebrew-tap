# Updates the CompressO cask to a published release of CompressO: its version & the SHA256 of the
# two DMGs attached to that release (the files people download, so the checksums always match),
# from templates/compresso.rb.template. Writes Casks/compresso.rb & a versioned copy,
# Casks/compresso@<version>.rb, and commits them. Run it from the Actions tab (Update CompressO ->
# Run workflow) once the release is published.
name: Update CompressO

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to update to, e.g. 4.0.0 (empty for the latest release)
        required: false
        default: ""

permissions:
  contents: write

env:
  APP_REPO: codeforreal1/compressO

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only published releases: a draft's files cannot be downloaded by Homebrew users
      - name: Find the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version=$(gh api "repos/$APP_REPO/releases/tags/$INPUT_VERSION" --jq .tag_name) || {
              echo "::error::No published release $INPUT_VERSION in $APP_REPO."
              exit 1
            }
          else
            version=$(gh api "repos/$APP_REPO/releases/latest" --jq .tag_name)
          fi
          echo "Version: $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download the DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" -R "$APP_REPO" -D dmgs \
            -p "CompressO_${VERSION}_aarch64.dmg" -p "CompressO_${VERSION}_x64.dmg"
          ls -l dmgs

      - name: Write the casks
        run: |
          arm64=$(sha256sum "dmgs/CompressO_${VERSION}_aarch64.dmg" | cut -d ' ' -f 1)
          x64=$(sha256sum "dmgs/CompressO_${VERSION}_x64.dmg" | cut -d ' ' -f 1)
          echo "Apple Silicon: $arm64"
          echo "Intel: $x64"
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{ARM64_SHA256}}/$arm64/g" -e "s/{{X64_SHA256}}/$x64/g" \
            templates/compresso.rb.template > Casks/compresso.rb
          sed "s/cask \"compresso\"/cask \"compresso@$VERSION\"/" Casks/compresso.rb \
            > "Casks/compresso@$VERSION.rb"
          ruby -c Casks/compresso.rb
          ruby -c "Casks/compresso@$VERSION.rb"
          cat Casks/compresso.rb

      - name: Commit
        run: |
          git add Casks
          if git diff --cached --quiet; then
            echo "The casks are already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: v$VERSION"
          git push
